name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - name: Verify explicit approval for this version
        run: node scripts/check-release.mjs
        env:
          APPROVED_RELEASE_VERSION: ${{ vars.APPROVED_RELEASE_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: npm install --global npm@11.5.1
      - name: Publish with GitHub OIDC and provenance
        run: npm publish --provenance --access public
      - name: Verify clean global installation
        run: |
          PACKAGE_VERSION=$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")
          npm install --global --prefix "$RUNNER_TEMP/clean-install" "@miraiforge/prefaix@$PACKAGE_VERSION"
          test "$("$RUNNER_TEMP/clean-install/bin/prefaix" --version)" = "$PACKAGE_VERSION"
          "$RUNNER_TEMP/clean-install/bin/prefaix" init zsh > "$RUNNER_TEMP/prefaix.zsh"
          "$RUNNER_TEMP/clean-install/bin/prefaix" init fish > "$RUNNER_TEMP/prefaix.fish"
          "$RUNNER_TEMP/clean-install/bin/prefaix" init bash > "$RUNNER_TEMP/prefaix.bash"
          test -s "$RUNNER_TEMP/prefaix.zsh"
          test -s "$RUNNER_TEMP/prefaix.fish"
          test -s "$RUNNER_TEMP/prefaix.bash"
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "Prefaix $GITHUB_REF_NAME" --notes-file docs/releases/0.1.0.md
