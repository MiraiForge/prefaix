name: Buildkite native CI
run-name: Janus Prefaix native ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Protected native dispatch request UUID
        type: string
        required: true
      build_id:
        description: Owning mirai-forge Buildkite build UUID
        type: string
        required: true
      source_sha:
        description: Frozen original-repository commit SHA
        type: string
        required: true
      source_ref:
        description: Frozen fully qualified branch or tag ref
        type: string
        required: true
      source_digest:
        description: SHA256 of the protected Buildkite source record
        type: string
        required: true
      flake_gate:
        description: Run the 50-rerun M3 stability gate
        type: boolean
        default: false
      pi_smoke:
        description: Frozen Linux Pi choice for source binding (does not run here)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: prefaix-buildkite-native-${{ inputs.request_id }}
  cancel-in-progress: false

jobs:
  check:
    name: Check (${{ matrix.os }}, Node ${{ matrix.node }})
    if: github.repository == 'MiraiForge/prefaix' && github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: source
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
        node: [22, 24, 26]
    steps:
      - name: Checkout reviewed native controller
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: MiraiForge/prefaix
          ref: ${{ github.workflow_sha }}
          path: control
          persist-credentials: false
      - name: Checkout frozen Buildkite source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: MiraiForge/prefaix
          ref: ${{ inputs.source_sha }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
      - name: Capture Buildkite native source
        run: node "$GITHUB_WORKSPACE/control/scripts/ci/buildkite-native-source.ts"
        env:
          PREFAIX_NATIVE_CHECK_RUN_ID: ${{ job.check_run_id }}
          PREFAIX_NATIVE_MATRIX: ${{ toJSON(matrix) }}
          PREFAIX_NATIVE_INPUTS: ${{ toJSON(inputs) }}
      - name: Preserve Buildkite native source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: buildkite-native-${{ inputs.request_id }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ job.check_run_id }}
          path: ${{ runner.temp }}/prefaix-buildkite-native-${{ github.run_id }}-${{ github.run_attempt }}-${{ job.check_run_id }}/source.json
          if-no-files-found: error
          retention-days: 36
          overwrite: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install shells for syntax tests and end-to-end gates
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install bash fish
      - name: Lint, typecheck, and unit tests
        run: bun run lint && bun run typecheck && bun run test:unit && bun run docs:check
      - name: AgentPort contract suite (fake and pi fixture)
        run: bun run test:contract
      - name: Shell end-to-end (pty harness)
        run: bun run test:e2e
        env:
          PREFAIX_E2E_REQUIRED: "1"
      - name: Coverage against the 95% target
        run: bun run coverage

  performance:
    # Keep the benchmark OS baseline explicit and its workload separate from tests.
    # Functional and shell compatibility continue to use the latest OS images.
    name: Performance (${{ matrix.os }}, Node ${{ matrix.node }})
    if: github.repository == 'MiraiForge/prefaix' && github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: source
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15]
        node: [22, 24, 26]
    steps:
      - name: Checkout reviewed native controller
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: MiraiForge/prefaix
          ref: ${{ github.workflow_sha }}
          path: control
          persist-credentials: false
      - name: Checkout frozen Buildkite source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: MiraiForge/prefaix
          ref: ${{ inputs.source_sha }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
      - name: Capture Buildkite native source
        run: node "$GITHUB_WORKSPACE/control/scripts/ci/buildkite-native-source.ts"
        env:
          PREFAIX_NATIVE_CHECK_RUN_ID: ${{ job.check_run_id }}
          PREFAIX_NATIVE_MATRIX: ${{ toJSON(matrix) }}
          PREFAIX_NATIVE_INPUTS: ${{ toJSON(inputs) }}
      - name: Preserve Buildkite native source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: buildkite-native-${{ inputs.request_id }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ job.check_run_id }}
          path: ${{ runner.temp }}/prefaix-buildkite-native-${{ github.run_id }}-${{ github.run_attempt }}-${{ job.check_run_id }}/source.json
          if-no-files-found: error
          retention-days: 36
          overwrite: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Compare Node and compiled Bun startup (S8, 50 samples)
        run: bun run spike:client-startup
        env:
          PREFAIX_STARTUP_REPORT: ${{ runner.temp }}/prefaix-startup.json
      - name: Preserve startup comparison
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: startup-${{ matrix.os }}-node${{ matrix.node }}
          path: ${{ runner.temp }}/prefaix-startup.json
          if-no-files-found: ignore
      - name: Built CLI performance budgets (50 samples)
        run: bun run test:perf
        env:
          PREFAIX_PERF_REPORT: ${{ runner.temp }}/prefaix-performance.json
      - name: Preserve performance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-${{ matrix.os }}-node${{ matrix.node }}
          path: ${{ runner.temp }}/prefaix-performance.json
          if-no-files-found: ignore

  shell-versions:
    name: Shells (${{ matrix.os }}, bash ${{ matrix.bash }}, fish ${{ matrix.fish }})
    if: github.repository == 'MiraiForge/prefaix' && github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: source
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bash: "4.4"
            fish: "3.6.4"
          - os: macos-latest
            bash: "5.2"
            fish: "4.0.2"
    steps:
      - name: Checkout reviewed native controller
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: MiraiForge/prefaix
          ref: ${{ github.workflow_sha }}
          path: control
          persist-credentials: false
      - name: Checkout frozen Buildkite source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: MiraiForge/prefaix
          ref: ${{ inputs.source_sha }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - name: Capture Buildkite native source
        run: node "$GITHUB_WORKSPACE/control/scripts/ci/buildkite-native-source.ts"
        env:
          PREFAIX_NATIVE_CHECK_RUN_ID: ${{ job.check_run_id }}
          PREFAIX_NATIVE_MATRIX: ${{ toJSON(matrix) }}
          PREFAIX_NATIVE_INPUTS: ${{ toJSON(inputs) }}
      - name: Preserve Buildkite native source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: buildkite-native-${{ inputs.request_id }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ job.check_run_id }}
          path: ${{ runner.temp }}/prefaix-buildkite-native-${{ github.run_id }}-${{ github.run_attempt }}-${{ job.check_run_id }}/source.json
          if-no-files-found: error
          retention-days: 36
          overwrite: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - name: Install native build dependencies
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install cmake ncurses pcre2 gettext rust
      - name: Build the exact supported shell versions
        env:
          BASH_VERSION_UNDER_TEST: ${{ matrix.bash }}
          FISH_VERSION_UNDER_TEST: ${{ matrix.fish }}
        run: |
          node scripts/install-test-shell.mjs bash "$BASH_VERSION_UNDER_TEST" "$RUNNER_TEMP/bash"
          node scripts/install-test-shell.mjs fish "$FISH_VERSION_UNDER_TEST" "$RUNNER_TEMP/fish"
          echo "PREFAIX_E2E_BASH=$RUNNER_TEMP/bash/bin/bash" >> "$GITHUB_ENV"
          echo "PREFAIX_E2E_FISH=$RUNNER_TEMP/fish/bin/fish" >> "$GITHUB_ENV"
      - run: bun install --frozen-lockfile
      - run: bun run test:e2e
        env:
          PREFAIX_E2E_REQUIRED: "1"
      - name: M3 stability gate (50 reruns)
        if: inputs.flake_gate == true || startsWith(inputs.source_ref, 'refs/tags/v')
        run: bun run test:flake
        env:
          PREFAIX_E2E_REQUIRED: "1"
      - name: Preserve stability logs
        if: always() && (inputs.flake_gate == true || startsWith(inputs.source_ref, 'refs/tags/v'))
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stability-${{ matrix.os }}-bash${{ matrix.bash }}-fish${{ matrix.fish }}
          path: source/build/flake
          if-no-files-found: ignore
