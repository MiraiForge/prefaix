name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
      - name: Enforce package privacy
        run: node scripts/check-private.mjs
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint, typecheck, and unit tests
        run: bun run lint && bun run typecheck && bun run test:unit
      - name: AgentPort contract suite (fake and pi fixture)
        run: bun run test:contract
      - name: Install shells for the end-to-end gates
        # DESIGN 12.5: zsh, fish, and bash 5 on Linux; macOS already has zsh and
        # bash, and runs bash 3.2 in its degraded mode.
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y zsh fish
          else
            brew install fish || echo "fish already installed"
          fi
      - name: Shell end-to-end (pty harness)
        run: bun run test:e2e
      - name: Coverage against the 95% target
        run: bun run coverage
      - name: Full check
        run: bun run check
      - name: Build available entry points
        run: bun run build
