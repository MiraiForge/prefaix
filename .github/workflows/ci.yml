name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      flake_gate:
        description: Run the 50-rerun M3 stability gate
        type: boolean
        default: false
      pi_smoke:
        description: Install pi and run the no-model smoke
        type: boolean
        default: false
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# JANUS_PREFAIX_CI_MODE=janus moves trusted ordinary Linux matrices to Janus.
# Keep all eight hosted macOS lanes and complete fork/manual/release matrices.
jobs:
  event-source:
    name: CI event source
    if: >-
      (github.workflow_ref == format('{0}/.github/workflows/ci.yml@{1}', github.repository, github.ref) &&
       github.event_name == 'workflow_dispatch') ||
      ((github.workflow_ref == format('{0}/.github/workflows/ci.yml@{1}', github.repository, github.ref) ||
        github.workflow_ref == format('{0}/.github/workflows/release.yml@{1}', github.repository, github.ref)) &&
       github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - name: Capture CI event source
        run: node scripts/ci/native-source.ts
        env:
          PREFAIX_NATIVE_CHECK_RUN_ID: ${{ job.check_run_id }}
          PREFAIX_NATIVE_WORKFLOW_REF: ${{ job.workflow_ref }}
          PREFAIX_NATIVE_WORKFLOW_SHA: ${{ job.workflow_sha }}
          PREFAIX_NATIVE_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          PREFAIX_NATIVE_WORKFLOW_PATH: ${{ job.workflow_file_path }}
          PREFAIX_NATIVE_MATRIX: "{}"
          PREFAIX_NATIVE_INPUTS: '{"flake_gate": ${{ inputs.flake_gate == true }}, "pi_smoke": ${{ inputs.pi_smoke == true }}}'
      - name: Preserve CI event source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: event-source-${{ github.run_id }}-${{ github.run_attempt }}-${{ job.check_run_id }}
          path: ${{ runner.temp }}/prefaix-event-${{ github.run_id }}-${{ github.run_attempt }}-${{ job.check_run_id }}/source.json
          if-no-files-found: error
          retention-days: 36
          overwrite: false

  check:
    name: Check (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(vars.JANUS_PREFAIX_CI_MODE == 'janus' && github.repository == 'MiraiForge/prefaix' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.base_ref == 'main')) && github.workflow_ref == format('{0}/.github/workflows/ci.yml@{1}', github.repository, github.ref) && '["macos-latest"]' || '["ubuntu-latest","macos-latest"]') }}
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
      - name: Capture native matrix source
        if: runner.os == 'macOS'
        run: node scripts/ci/native-source.ts
        env:
          PREFAIX_NATIVE_CHECK_RUN_ID: ${{ job.check_run_id }}
          PREFAIX_NATIVE_WORKFLOW_REF: ${{ job.workflow_ref }}
          PREFAIX_NATIVE_WORKFLOW_SHA: ${{ job.workflow_sha }}
          PREFAIX_NATIVE_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          PREFAIX_NATIVE_WORKFLOW_PATH: ${{ job.workflow_file_path }}
          PREFAIX_NATIVE_MATRIX: ${{ toJSON(matrix) }}
          PREFAIX_NATIVE_INPUTS: '{"flake_gate": ${{ inputs.flake_gate == true }}, "pi_smoke": ${{ inputs.pi_smoke == true }}}'
      - name: Preserve native matrix source
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-source-${{ github.run_id }}-${{ github.run_attempt }}-${{ job.check_run_id }}
          path: ${{ runner.temp }}/prefaix-native-${{ github.run_id }}-${{ github.run_attempt }}-${{ job.check_run_id }}/source.json
          if-no-files-found: error
          retention-days: 36
          overwrite: false
      - name: Enforce package privacy
        run: node scripts/check-private.mjs
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install shells for syntax tests and end-to-end gates
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y zsh fish
          else
            HOMEBREW_NO_AUTO_UPDATE=1 brew install bash fish
          fi
      - name: Lint, typecheck, and unit tests
        run: bun run lint && bun run typecheck && bun run test:unit && bun run docs:check
      - name: AgentPort contract suite (fake and pi fixture)
        run: bun run test:contract
      - name: Shell end-to-end (pty harness)
        run: bun run test:e2e
        env:
          PREFAIX_E2E_REQUIRED: "1"
      - name: Coverage against the 95% target
        run: bun run coverage

  performance:
    # Keep the benchmark OS baseline explicit and its workload separate from tests.
    # Functional and shell compatibility continue to use the latest OS images.
    name: Performance (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(vars.JANUS_PREFAIX_CI_MODE == 'janus' && github.repository == 'MiraiForge/prefaix' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.base_ref == 'main')) && github.workflow_ref == format('{0}/.github/workflows/ci.yml@{1}', github.repository, github.ref) && '["macos-15"]' || '["ubuntu-24.04","macos-15"]') }}
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
      - name: Capture native matrix source
        if: runner.os == 'macOS'
        run: node scripts/ci/native-source.ts
        env:
          PREFAIX_NATIVE_CHECK_RUN_ID: ${{ job.check_run_id }}
          PREFAIX_NATIVE_WORKFLOW_REF: ${{ job.workflow_ref }}
          PREFAIX_NATIVE_WORKFLOW_SHA: ${{ job.workflow_sha }}
          PREFAIX_NATIVE_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          PREFAIX_NATIVE_WORKFLOW_PATH: ${{ job.workflow_file_path }}
          PREFAIX_NATIVE_MATRIX: ${{ toJSON(matrix) }}
          PREFAIX_NATIVE_INPUTS: '{"flake_gate": ${{ inputs.flake_gate == true }}, "pi_smoke": ${{ inputs.pi_smoke == true }}}'
      - name: Preserve native matrix source
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-source-${{ github.run_id }}-${{ github.run_attempt }}-${{ job.check_run_id }}
          path: ${{ runner.temp }}/prefaix-native-${{ github.run_id }}-${{ github.run_attempt }}-${{ job.check_run_id }}/source.json
          if-no-files-found: error
          retention-days: 36
          overwrite: false
      - name: Enforce package privacy
        run: node scripts/check-private.mjs
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Compare Node and compiled Bun startup (S8, 50 samples)
        run: bun run spike:client-startup
        env:
          PREFAIX_STARTUP_REPORT: ${{ runner.temp }}/prefaix-startup.json
      - name: Preserve startup comparison
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: startup-${{ matrix.os }}-node${{ matrix.node }}
          path: ${{ runner.temp }}/prefaix-startup.json
          if-no-files-found: ignore
      - name: Built CLI performance budgets (50 samples)
        run: bun run test:perf
        env:
          PREFAIX_PERF_REPORT: ${{ runner.temp }}/prefaix-performance.json
      - name: Preserve performance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-${{ matrix.os }}-node${{ matrix.node }}
          path: ${{ runner.temp }}/prefaix-performance.json
          if-no-files-found: ignore

  shell-versions:
    name: Shells (${{ matrix.os }}, bash ${{ matrix.bash }}, fish ${{ matrix.fish }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(vars.JANUS_PREFAIX_CI_MODE == 'janus' && github.repository == 'MiraiForge/prefaix' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.base_ref == 'main')) && github.workflow_ref == format('{0}/.github/workflows/ci.yml@{1}', github.repository, github.ref) && '[{"os":"macos-latest","bash":"4.4","fish":"3.6.4"},{"os":"macos-latest","bash":"5.2","fish":"4.0.2"}]' || '[{"os":"ubuntu-latest","bash":"4.4","fish":"3.6.4"},{"os":"ubuntu-latest","bash":"5.2","fish":"4.0.2"},{"os":"macos-latest","bash":"4.4","fish":"3.6.4"},{"os":"macos-latest","bash":"5.2","fish":"4.0.2"}]') }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - name: Capture native matrix source
        if: runner.os == 'macOS'
        run: node scripts/ci/native-source.ts
        env:
          PREFAIX_NATIVE_CHECK_RUN_ID: ${{ job.check_run_id }}
          PREFAIX_NATIVE_WORKFLOW_REF: ${{ job.workflow_ref }}
          PREFAIX_NATIVE_WORKFLOW_SHA: ${{ job.workflow_sha }}
          PREFAIX_NATIVE_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          PREFAIX_NATIVE_WORKFLOW_PATH: ${{ job.workflow_file_path }}
          PREFAIX_NATIVE_MATRIX: ${{ toJSON(matrix) }}
          PREFAIX_NATIVE_INPUTS: '{"flake_gate": ${{ inputs.flake_gate == true }}, "pi_smoke": ${{ inputs.pi_smoke == true }}}'
      - name: Preserve native matrix source
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-source-${{ github.run_id }}-${{ github.run_attempt }}-${{ job.check_run_id }}
          path: ${{ runner.temp }}/prefaix-native-${{ github.run_id }}-${{ github.run_attempt }}-${{ job.check_run_id }}/source.json
          if-no-files-found: error
          retention-days: 36
          overwrite: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - name: Install native build dependencies
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y zsh cmake build-essential libncurses-dev libpcre2-dev gettext
          else
            HOMEBREW_NO_AUTO_UPDATE=1 brew install cmake ncurses pcre2 gettext rust
          fi
      - name: Build the exact supported shell versions
        env:
          BASH_VERSION_UNDER_TEST: ${{ matrix.bash }}
          FISH_VERSION_UNDER_TEST: ${{ matrix.fish }}
        run: |
          node scripts/install-test-shell.mjs bash "$BASH_VERSION_UNDER_TEST" "$RUNNER_TEMP/bash"
          node scripts/install-test-shell.mjs fish "$FISH_VERSION_UNDER_TEST" "$RUNNER_TEMP/fish"
          echo "PREFAIX_E2E_BASH=$RUNNER_TEMP/bash/bin/bash" >> "$GITHUB_ENV"
          echo "PREFAIX_E2E_FISH=$RUNNER_TEMP/fish/bin/fish" >> "$GITHUB_ENV"
      - run: bun install --frozen-lockfile
      - run: bun run test:e2e
        env:
          PREFAIX_E2E_REQUIRED: "1"
      - name: M3 stability gate (50 reruns)
        if: inputs.flake_gate == true || startsWith(github.ref, 'refs/tags/v')
        run: bun run test:flake
        env:
          PREFAIX_E2E_REQUIRED: "1"
      - name: Preserve stability logs
        if: always() && (inputs.flake_gate == true || startsWith(github.ref, 'refs/tags/v'))
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stability-${{ matrix.os }}-bash${{ matrix.bash }}-fish${{ matrix.fish }}
          path: build/flake
          if-no-files-found: ignore

  pi-smoke:
    name: Pi no-model smoke
    if: inputs.pi_smoke == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - run: npm install --global --ignore-scripts @earendil-works/pi-coding-agent@1.0.4
      - run: bun install --frozen-lockfile
      - run: bun run test:pi-smoke

  required:
    name: M3 required checks
    if: always()
    needs: [check, performance, shell-versions]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      statuses: read
    steps:
      - name: Reject canceled CI
        if: cancelled()
        run: exit 1
      - name: Verify required CI
        env:
          HOSTED_RESULTS: ${{ toJSON(needs) }}
          REQUIRED_HOSTED_JOBS: '["check","performance","shell-versions"]'
          USE_JANUS: ${{ vars.JANUS_PREFAIX_CI_MODE == 'janus' && github.repository == 'MiraiForge/prefaix' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.base_ref == 'main')) && github.workflow_ref == format('{0}/.github/workflows/ci.yml@{1}', github.repository, github.ref) }}
          EXPECTED_REPOSITORY: MiraiForge/prefaix
          JANUS_PIPELINE: prefaix-shadow-ci
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import http.client
          import json
          import os
          import re
          import time
          import urllib.error
          import urllib.request


          def selected_status(rows, context, pipeline):
              if not isinstance(rows, list):
                  raise ValueError('GitHub status response must be a list')
              # The commit-status endpoint returns newest first. Never fall back to an
              # older success when the latest matching status is pending or failed.
              row = next((item for item in rows if item.get('context') == context), None)
              if row is None:
                  return None
              creator = row.get('creator') or {}
              if (creator.get('id'), creator.get('login'), creator.get('type')) != (
                  20291210, 'buildkite-limited-access[bot]', 'Bot'
              ):
                  raise ValueError('Janus status was not written by the approved Buildkite app')
              prefix = 'https://buildkite.com/mirai-forge/' + pipeline + '/builds/'
              if not re.fullmatch(re.escape(prefix) + r'[1-9][0-9]*', row.get('target_url') or ''):
                  raise ValueError('Janus aggregate target is not the approved pipeline build')
              state = row.get('state')
              if state not in ('pending', 'success', 'failure', 'error'):
                  raise ValueError('Unknown Janus status state')
              return state


          def main():
              needs = json.loads(os.environ['HOSTED_RESULTS'])
              use_janus = os.environ['USE_JANUS'] == 'true'
              required = json.loads(os.environ.get('REQUIRED_HOSTED_JOBS', '[]'))
              allowed = ('success', 'skipped') if use_janus else ('success',)
              if (not needs or any(job.get('result') not in allowed for job in needs.values())
                      or any(needs.get(name, {}).get('result') != 'success' for name in required)):
                  raise SystemExit('A required hosted job did not pass')
              if not use_janus:
                  print('Required hosted jobs passed')
                  return
              repository = os.environ['EXPECTED_REPOSITORY']
              pipeline = os.environ['JANUS_PIPELINE']
              if os.environ['GITHUB_REPOSITORY'] != repository:
                  raise SystemExit('Repository identity mismatch')
              with open(os.environ['GITHUB_EVENT_PATH']) as event_file:
                  event = json.load(event_file)
              if os.environ['GITHUB_EVENT_NAME'] == 'pull_request':
                  pr = event['pull_request']
                  if pr['head']['repo']['full_name'] != repository or pr['base']['ref'] != 'main':
                      raise SystemExit('Janus requires a same-repository PR targeting main')
                  sha = pr['head']['sha']
                  context = 'buildkite/' + pipeline + '/pr'
              elif os.environ['GITHUB_EVENT_NAME'] == 'push' and os.environ['GITHUB_REF'] == 'refs/heads/main':
                  sha = os.environ['GITHUB_SHA']
                  context = 'buildkite/' + pipeline
              else:
                  raise SystemExit('Event is not admitted to Janus ordinary CI')
              if not re.fullmatch(r'[0-9a-f]{40}', sha):
                  raise SystemExit('Source must be an exact commit')
              url = 'https://api.github.com/repos/' + repository + '/commits/' + sha + '/statuses?per_page=100&page='
              headers = {
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              }
              deadline = time.monotonic() + 30 * 60
              page = 1
              # The shared cap counts every page and every failed request.
              for _ in range(121):
                  remaining = deadline - time.monotonic()
                  if remaining <= 0:
                      break
                  delay = 15
                  request = urllib.request.Request(url + str(page), headers=headers)
                  try:
                      with urllib.request.urlopen(request, timeout=min(10, remaining)) as response:
                          rows = json.load(response)
                  except urllib.error.HTTPError as error:
                      retry_after = error.headers.get('Retry-After', '') if error.headers else ''
                      reset = error.headers.get('X-RateLimit-Reset', '') if error.headers else ''
                      exhausted = error.headers and error.headers.get('X-RateLimit-Remaining') == '0'
                      retryable = error.code in (429, 500, 502, 503, 504)
                      limited = False
                      try:
                          limited = error.code == 403 and (
                              bool(retry_after) or exhausted or 'secondary rate limit' in
                              error.read(4096).decode('utf-8', errors='replace').lower()
                          )
                      except (OSError, http.client.HTTPException):
                          retryable = True
                      finally:
                          error.close()
                      if not limited and not retryable:
                          raise
                      if retry_after.isdigit():
                          delay = max(delay, int(retry_after))
                      if exhausted and reset.isdigit():
                          delay = max(delay, int(reset) - time.time())
                  except (OSError, http.client.HTTPException, json.JSONDecodeError):
                      pass
                  else:
                      state = selected_status(rows, context, pipeline)
                      if state == 'success':
                          print('Verified ' + context + ' for ' + sha)
                          return
                      if state in ('failure', 'error'):
                          raise SystemExit('Janus ordinary CI failed for ' + sha)
                      if state is None and len(rows) == 100:
                          page += 1
                          continue
                  page = 1
                  time.sleep(min(delay, max(0, deadline - time.monotonic())))
              raise SystemExit('Janus ordinary CI did not pass within 30 minutes or 121 reads')


          if __name__ == '__main__':
              main()
          PY
